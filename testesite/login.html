<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - BarberTech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-image"></div>
    <main class="hero">
        <div class="container-login" style="background:rgba(32,32,36,0.95); display: flex; flex-direction: column; justify-content: center; padding: 40px 40px; gap: 10px; align-items:center; min-width:70%; min-height:50%; border-radius:6px; border:2px solid rgba(238, 235, 235, 0.39)">
            <h2 style="margin-bottom:10px; color:white">Login do Gestor</h2>
            <p style="color:#9c9c9c; margin-bottom:30px">Acesso exclusivo administrador</p>
            <form onsubmit="event.preventDefault(); window.location.href='admin.html'">
                <div style="margin-bottom:15px; text-align:left">
                    <label style="display:block; font-size: 1.5rem; margin-top: 20px; color:#ccc; margin-bottom:5px">EMAIL:</label>
                    <input type="email" class="input-transparent" style="min-width: 500px;font-size: 1.5rem;background:rgba(0,0,0,0.3); border:1px solid #444; border-radius:6px; padding:12px;" required>
                </div>
                <div style="margin-bottom:20px; text-align:left">
                    <label style="display:block; font-size: 1.5rem; color:#ccc; margin-bottom:5px">SENHA:</label>
                    <input type="password" class="input-transparent" style="min-width: 500px; font-size: 1.5rem; background:rgba(0,0,0,0.3); border:1px solid #444; border-radius:6px; padding:12px; margin-bottom: 20px;" required>
                </div>
                <button type="submit" class="btn-primary" style="width:100%; font-size: 2rem;">ENTRAR</button>
            </form>
        </div>
    </main>
</body>
</html>
